<div class="profile-edit-backdrop" (click)="closeOnBackdrop($event)">
    <section class="profile-edit" role="dialog" aria-modal="true" aria-labelledby="profile-edit-title"
        (click)="$event.stopPropagation()">

        <header class="profile-edit__header">
            <h2 id="profile-edit-title">Dein Profil bearbeiten</h2>
            <button type="button" class="icon-button" aria-label="Schließen" (click)="closed.emit()">
                <span class="dialog-icon close-icon" aria-hidden="true"></span>
            </button>
        </header>

        <div class="profile-edit__avatar">
            <img [src]="avatarSrc(avatar())" [alt]="'Profilbild ' + avatarName(avatar())">

            <button type="button" class="avatar-edit" aria-label="Avatar ändern"
                [attr.aria-expanded]="pickerOpen()" aria-controls="avatar-picker" (click)="togglePicker()">
                <span class="dialog-icon pencil-icon" aria-hidden="true"></span>
            </button>

            @if (pickerOpen()) {
            <div id="avatar-picker" class="avatar-picker" role="group" aria-label="Avatar auswählen">
                @for (option of avatars; track option) {
                <button type="button" class="avatar-option" [class.selected]="option === avatar()"
                    [attr.aria-pressed]="option === avatar()" [attr.aria-label]="avatarName(option)"
                    (click)="pickAvatar(option)">
                    <img [src]="avatarSrc(option)" alt="">
                </button>
                }
            </div>
            }
        </div>

        <form class="profile-edit__form" (submit)="submit($event)" novalidate>
            <div class="field">
                <label class="field__label" for="profile-name">
                    <span class="dialog-icon person-icon" aria-hidden="true"></span>
                    Vollständiger Name
                </label>

                <input #nameInput id="profile-name" type="text" class="field__input" autocomplete="name"
                    placeholder="Frederik Beck" [value]="name()" (input)="name.set(nameInput.value)"
                    (blur)="touched.set(true)" [attr.aria-invalid]="showNameError"
                    aria-describedby="profile-name-error">

                @if (showNameError) {
                <span id="profile-name-error" class="field__error" role="alert">{{ nameErrorMessage }}</span>
                }
            </div>

            @if (saveError()) {
            <p class="form-error" role="alert">{{ saveError() }}</p>
            }

            <div class="profile-edit__actions">
                <button type="button" class="btn btn--ghost" (click)="closed.emit()">Abbrechen</button>
                <button type="submit" class="btn btn--primary" [disabled]="!formValid">Speichern</button>
            </div>
        </form>
    </section>
</div>
