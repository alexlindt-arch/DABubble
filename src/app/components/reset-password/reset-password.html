<div class="reset-page">
  <header class="reset-page__header">
    <img class="reset-page__logo" src="/assets/img/Home-Workspaces.svg" alt="DABubble Logo" />
  </header>

  <section class="reset-card">
    <div class="reset-card__top">
      <button
        type="button"
        class="back-button"
        aria-label="Zurück zur Anmeldung"
        (click)="goBack()"
      >
        <img src="/assets/img/icons/arrow_back.svg" alt="" />
      </button>
      <h1 class="reset-card__title">Passwort zurücksetzen</h1>
    </div>

    <form
      class="reset-form"
      [formGroup]="resetForm"
      (ngSubmit)="submitNewPassword()"
      novalidate
    >
      <div class="form-field">
        <label class="input-group">
          <img class="input-group__icon" src="/assets/img/icons/lock-default.svg" alt="" />
          <input
            class="input-group__input"
            type="password"
            formControlName="password"
            placeholder="Neues Passwort"
            autocomplete="new-password"
            aria-label="Neues Passwort"
          />
        </label>
        @if (passwordErrorMessage && resetForm.controls.password.touched) {
          <span class="form-field__error">{{ passwordErrorMessage }}</span>
        }
      </div>

      <div class="form-field">
        <label class="input-group">
          <img class="input-group__icon" src="/assets/img/icons/lock-default.svg" alt="" />
          <input
            class="input-group__input"
            type="password"
            formControlName="confirm"
            placeholder="Neues Kennwort bestätigen"
            autocomplete="new-password"
            aria-label="Neues Kennwort bestätigen"
          />
        </label>
        @if (confirmErrorMessage && resetForm.controls.confirm.touched) {
          <span class="form-field__error">{{ confirmErrorMessage }}</span>
        }
      </div>

      @if (passwordChanged) {
        <p class="reset-form__success" role="status">Dein Passwort wurde geändert.</p>
      }

      <div class="reset-form__actions">
        <button type="submit" class="btn btn--primary" [disabled]="resetForm.invalid">
          Passwort ändern
        </button>
      </div>
    </form>
  </section>

  <footer class="reset-page__footer">
    <span class="reset-page__footer-link">Impressum</span>
    <span class="reset-page__footer-link">Datenschutz</span>
  </footer>
</div>
