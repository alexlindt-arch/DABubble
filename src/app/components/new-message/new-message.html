<section class="new-message-content">
    <header class="new-message-header">
        <h2>Neue Nachricht</h2>
        <label class="recipient-field">
            <span class="visually-hidden">Empfänger</span>
            <input #recipientInput type="text" placeholder="An: @jemand oder E-Mail-Adresse" autocomplete="off"
                [value]="recipientQuery()" (input)="updateRecipientQuery(recipientInput.value)">
            @if (suggestions().length) {
            <ul class="recipient-suggestions" role="listbox" aria-label="Person auswählen">
                @for (user of suggestions(); track user.uid) {
                <li><button type="button" (click)="selectRecipient(user)"><img [src]="avatar(user)" alt=""><span>{{ user.name }}</span></button></li>
                }
            </ul>
            }
        </label>
    </header>

    <div class="new-message-body">
        <form class="message-composer" (submit)="sendMessage($event)">
            <textarea #editor aria-label="Neue Nachricht" placeholder="Starte eine neue Nachricht"
                [value]="draft()" (input)="draft.set(editor.value)"></textarea>
            <div class="composer-actions">
                <button type="button" class="composer-button" aria-label="Emoji auswählen"
                    [attr.aria-expanded]="emojiPickerOpen()" (click)="emojiPickerOpen.set(!emojiPickerOpen())">
                    <span class="composer-icon emoji-icon" aria-hidden="true"></span>
                </button>
                <button type="submit" class="composer-button send-button" aria-label="Nachricht senden"
                    [disabled]="!recipient() || !draft().trim()">
                    <span class="composer-icon send-icon" aria-hidden="true"></span>
                </button>
            </div>
            @if (emojiPickerOpen()) {
            <div class="emoji-picker" role="group" aria-label="Emoji auswählen">
                @for (emoji of emojis; track emoji) { <button type="button" (click)="insertEmoji(emoji)">{{ emoji }}</button> }
            </div>
            }
        </form>
    </div>
</section>
